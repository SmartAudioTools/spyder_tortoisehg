[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-tortoisehg"
version = "0.1.0"
description = "Panneau Mercurial dans Spyder : le RepoWidget de TortoiseHg (graphe des revisions, fichiers, diff) ancre comme greffon"
requires-python = ">=3.9"
# tortoisehg n'est pas declare ici, et ne PEUT pas l'etre : le projet du meme nom sur PyPI est
# vide (version « unknown », aucun fichier publie - mesure du 10/08/2026), et l'archive amont
# est ecrite pour PyQt5, inutilisable sous le PySide6 de Spyder. Il est donc LIVRE AVEC le
# greffon, sous spyder_tortoisehg/_vendor/, deja patche - cf. outils/vendoriser_tortoisehg.py.
# mercurial, lui, est une dependance ordinaire : c'est la bibliotheque que TortoiseHg pilote.
dependencies = ["qtpy", "qtawesome", "mercurial>=7.2,<8"]

# Spyder decouvre les greffons tiers par ce groupe de points d'entree. Le nom du point d'entree
# DOIT etre identique a l'attribut NAME de la classe, sinon Spyder leve une SpyderAPIError et
# ignore le greffon (spyder/app/find_plugins.py).
[project.entry-points."spyder.plugins"]
tortoisehg = "spyder_tortoisehg.spyder.plugin:TortoiseHgPlugin"

[tool.setuptools.packages.find]
include = ["spyder_tortoisehg*"]
# _vendor n'est PAS un paquet : c'est une racine ajoutee a sys.path (cf. spyder_tortoisehg/
# __init__.py). Il n'a volontairement pas d'__init__.py, et TortoiseHg doit s'y importer sous
# son vrai nom - « import tortoisehg », pas « spyder_tortoisehg._vendor.tortoisehg », que ses
# 135 fichiers d'imports relatifs et absolus ne connaissent pas.
# Cette ligne n'est PAS decorative : en pyproject, setuptools cherche par defaut les paquets
# IMPLICITES (namespaces = true), donc l'absence d'__init__.py ne suffit pas a l'ecarter.
# Mesure du 10/08/2026 : sans elle, 100 paquets declares au lieu de 3, dont 97 sous _vendor.
exclude = ["spyder_tortoisehg._vendor*"]

# ... donc il voyage comme DONNEES de paquet. Le « ** » recursif demande setuptools >= 62.3,
# couvert par le requires ci-dessus.
[tool.setuptools.package-data]
spyder_tortoisehg = ["_vendor/**"]

# smartos_qsci : l'emulation maison de QScintilla sur QPlainTextEdit (aucun binding PySide6
# de QScintilla n'existe), importee par le TortoiseHg patche. Module RACINE, a cote du
# paquet : il doit etre importable en `import smartos_qsci` dans le venv de Spyder.
# Vivait dans SmartOS Commun/scripts/ jusqu'au 08/08/2026 ; il voyage desormais avec le
# greffon, seul consommateur.
[tool.setuptools]
py-modules = ["smartos_qsci"]
